<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="error-container">
        <div class="illustration" aria-hidden="true">
            <div class="planet">
                <span class="crater crater-one"></span>
                <span class="crater crater-two"></span>
                <span class="planet-face">:)</span>
            </div>
            <span class="star star-one">✦</span>
            <span class="star star-two">✧</span>
            <span class="star star-three">✦</span>
            <span class="orbit"></span>
        </div>

        <h1>404</h1>

        <h2>Oops! Lost in Space?</h2>

        <p>
            Looks like this page has wandered off into the universe.
            Don't worry, let's get you back home!
        </p>

        <a href="/" class="home-button">
            <span>←</span> Back to Homepage
        </a>

        <p class="footer-text">Even astronauts take a wrong turn sometimes. 🚀</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
